<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석 현황</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">📋 하남점 출석 현황</h2>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b bg-gray-100">
                        <th class="p-3 font-semibold text-gray-700">이름</th>
                        <th class="p-3 font-semibold text-gray-700">이메일</th>
                        <th class="p-3 font-semibold text-gray-700">출석 상태</th>
                        <th class="p-3 font-semibold text-gray-700">출석 시간</th>
                    </tr>
                </thead>
                <tbody id="attendance-list">
                    <tr>
                        <td colspan="4" class="text-center p-4 text-gray-500">데이터를 불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="inline-block bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition font-medium text-sm">
                돌아가기
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://audqceakcywsoxnaolzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1ZHFjZWFrY3l3c294bmFvbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTM4NTEsImV4cCI6MjEwNDI4OTg1MX0.2u_bFN4Vo4GRx0VfrAqk7IknF5W-fYPf0kGGMelzxzg';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAttendance() {
            const tableBody = document.getElementById('attendance-list');

            // login 테이블에서 모든 사용자 정보 조회
            const { data, error } = await supabaseClient
                .from('login')
                .select('name, email, attendance_status, attendance_time');

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-red-500">불러오기 실패: ${error.message}</td></tr>`;
                return;
            }

            if (data && data.length > 0) {
                tableBody.innerHTML = '';
                data.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="p-3 text-gray-800">${user.name || '-'}</td>
                        <td class="p-3 text-gray-600 text-sm">${user.email || '-'}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-semibold ${user.attendance_status === '출석완료' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                                ${user.attendance_status || '미출석'}
                            </span>
                        </td>
                        <td class="p-3 text-gray-500 text-sm">${user.attendance_time || '-'}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">등록된 사용자가 없습니다.</td></tr>`;
            }
        }

        fetchAttendance();
    </script>
</body>
</html>
