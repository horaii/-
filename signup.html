<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">회원가입</h2>
        
        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                <input type="text" id="name" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                <input type="email" id="email" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                <input type="password" id="password" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                가입하기
            </button>
        </form>

        <p id="message" class="mt-4 text-center text-sm"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://audqceakcywsoxnaolzf.supabase.co  ';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1ZHFjZWFrY3l3c294bmFvbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTM4NTEsImV4cCI6MjEwNDI4OTg1MX0.2u_bFN4Vo4GRx0VfrAqk7IknF5W-fYPf0kGGMelzxzg'
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            messageEl.textContent = '저장 중...';
            messageEl.className = 'mt-4 text-center text-sm text-gray-500';

            // '출석체크' 테이블에 직접 데이터를 삽입합니다.
            const { data, error } = await supabaseClient
                .from('login')
                .insert([
                    { name: name, email: email, password: password }
                ]);

            if (error) {
                messageEl.textContent = `저장 실패: ${error.message}`;
                messageEl.className = 'mt-4 text-center text-sm text-red-600';
            } else {
                messageEl.textContent = '회원가입(데이터 저장) 성공!';
                messageEl.className = 'mt-4 text-center text-sm text-green-600';
                document.getElementById('signup-form').reset();
            }
            setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            
        });
    </script>
</body>
</html>
