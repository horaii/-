<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">로그인</h2>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                <input type="email" id="email" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                <input type="password" id="password" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">
                로그인
            </button>
        </form>

        <!-- 회원가입 페이지로 이동하는 링크 추가 -->
        <p class="mt-4 text-center text-sm text-gray-600">
            계정이 없으신가요? 
            <a href="signup.html" class="text-indigo-600 font-medium hover:underline">회원가입</a>
        </p>

        <p id="message" class="mt-4 text-center text-sm"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://audqceakcywsoxnaolzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1ZHFjZWFrY3l3c294bmFvbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTM4NTEsImV4cCI6MjEwNDI4OTg1MX0.2u_bFN4Vo4GRx0VfrAqk7IknF5W-fYPf0kGGMelzxzg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            messageEl.textContent = '로그인 중...';
            messageEl.className = 'mt-4 text-center text-sm text-gray-500';

            // 'login' 테이블에서 입력한 이메일과 비밀번호가 일치하는 데이터 조회
            const { data, error } = await supabaseClient
                .from('login')
                .select('*')
                .eq('email', email)
                .eq('password', password);

            if (error) {
                messageEl.textContent = `로그인 오류: ${error.message}`;
                messageEl.className = 'mt-4 text-center text-sm text-red-600';
            } else if (data && data.length > 0) {
                // 일치하는 계정이 존재할 경우 (로그인 성공)
                const loggedInUser = data[0]; // Supabase에서 조회된 사용자 정보
                
                // 브라우저에 사용자 정보 저장
                localStorage.setItem('userName', loggedInUser.name);
                localStorage.setItem('userEmail', loggedInUser.email);

                messageEl.textContent = '로그인 성공! 출석체크 페이지로 이동합니다...';
                messageEl.className = 'mt-4 text-center text-sm text-green-600';
                
                // 1.5초 후 index.html로 이동
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                // 이메일이나 비밀번호가 틀린 경우
                messageEl.textContent = '이메일 또는 비밀번호가 일치하지 않습니다.';
                messageEl.className = 'mt-4 text-center text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
